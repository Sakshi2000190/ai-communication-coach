    <script>
      // Emscripten WebAssembly routes stderr to console.error by default.
      // Re-route informational C++ delegate logs (e.g. "INFO: Created TensorFlow Lite XNNPACK delegate for CPU.")
      // to console.info so they are not treated as runtime exceptions.
      (function() {
        var origError = console.error;
        var origWarn = console.warn;
        function isTfInfo(arg) {
          if (typeof arg !== 'string') return false;
          return (
            arg.indexOf('XNNPACK delegate') !== -1 ||
            arg.indexOf('TensorFlow Lite') !== -1 ||
            arg.indexOf('INFO: Created') === 0 ||
            arg.indexOf('INFO:') === 0
          );
        }
        console.error = function() {
          if (arguments.length > 0 && isTfInfo(arguments[0])) {
            console.info.apply(console, arguments);
            return;
          }
          origError.apply(console, arguments);
        };
        console.warn = function() {
          if (arguments.length > 0 && isTfInfo(arguments[0])) {
            console.info.apply(console, arguments);
            return;
          }
          origWarn.apply(console, arguments);
        };
      })();
    </script>
